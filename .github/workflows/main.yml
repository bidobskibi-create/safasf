
name: SwipeNav Build

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager --install "platforms;android-19" "build-tools;34.0.0"

      - name: Find and build SwipeNav
        id: build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_SCRIPT=$(find . -type f -name build.sh -not -path '*/.git/*' -print -quit)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "ERROR: build.sh not found!"
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_SCRIPT")
          echo "Found SwipeNav in: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          bash ./build.sh

          OUTPUT="$PROJECT_DIR/out/SwipeNav-flash.zip"
          test -s "$OUTPUT"

          echo "artifact_path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload SwipeNav
        uses: actions/upload-artifact@v7
        with:
          name: SwipeNav-flash
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error
